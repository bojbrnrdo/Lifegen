name: LIFEGEN Development Package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Restrict packaging to development branches
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$BRANCH_NAME" != "develop" && ! "$BRANCH_NAME" =~ ^(feature|fix)/[a-zA-Z0-9._-]+$ ]]; then
            echo "::error::Packaging is restricted to development branches."
            exit 1
          fi
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Validate application
        run: |
          npm run build
          npm test
      - name: Create portable source package
        run: |
          mkdir -p dist
          git archive --format=zip --output=dist/LIFEGEN-source.zip HEAD
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: lifegen-source-${{ github.ref_name }}
          path: dist/LIFEGEN-source.zip
          retention-days: 7
