name: LifeIDE browser smoke

on:
  pull_request:
    paths:
      - 'public/lifeide/**'
      - 'src/lifeide.js'
      - 'src/auth.js'
      - 'tests/lifeide-browser-smoke.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/lifeide-browser-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifeide-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run isolated LifeIDE browser smoke test
        env:
          LOCAL_DEMO: 'false'
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            export CHROME_PATH="$(command -v google-chrome)"
          elif command -v chromium >/dev/null 2>&1; then
            export CHROME_PATH="$(command -v chromium)"
          else
            echo "Chrome or Chromium is required" >&2
            exit 1
          fi
          npm run test:lifeide-browser
